name: Feature / user story
description: A new capability or a change in behaviour
labels: ["feature"]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      description: As a <who>, I want <what>, so that <why>.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Concrete, testable conditions. "Given ... when ... then ..." works well.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Technical notes
      description: Hints, constraints, open questions, links.
