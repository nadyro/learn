# Local Prometheus. In production the platform team's Prometheus discovers pods through Kubernetes annotations.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: commerce-service
    metrics_path: /actuator/prometheus
    static_configs:
      # Service started from source with `make run` (on your machine). Only one of the two targets is up at a time.
      - targets: ["host.docker.internal:8081"]
        labels:
          runtime: host
      # Service started in Docker with `make up-app`.
      - targets: ["commerce-service:8081"]
        labels:
          runtime: docker
