apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: commerce-production

resources:
  - ../../base

configMapGenerator:
  - name: commerce-service-config
    behavior: merge
    literals:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://commerce-db.production.internal:5432/commerce
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka.production.internal:9092
      - COMMERCE_CORS_ALLOWED_ORIGINS=https://shop.kestrel-outfitters.example
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=15

patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: commerce-service
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 12
  - target:
      kind: Deployment
      name: commerce-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "1"
            memory: 1536Mi
          limits:
            memory: 1536Mi
  - target:
      kind: PodDisruptionBudget
      name: commerce-service
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 2
