apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: commerce-staging

resources:
  - ../../base

configMapGenerator:
  - name: commerce-service-config
    behavior: merge
    literals:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://commerce-db.staging.internal:5432/commerce
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka.staging.internal:9092
      - COMMERCE_CORS_ALLOWED_ORIGINS=https://shop.staging.kestrel-outfitters.example
      - MANAGEMENT_TRACING_SAMPLING_PROBABILITY=1.0
      - SPRINGDOC_API_DOCS_ENABLED=true
      - SPRINGDOC_SWAGGER_UI_ENABLED=true
