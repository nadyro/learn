# Secrets are never stored in Git. The External Secrets Operator copies them from the cloud secret manager into a
# Kubernetes Secret named commerce-service-secrets, which the Deployment loads as environment variables.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: commerce-service-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kestrel-secret-manager
  target:
    name: commerce-service-secrets
  data:
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: commerce-service/database
        property: password
    - secretKey: COMMERCE_PAYMENTS_WEBHOOK_SIGNING_SECRET
      remoteRef:
        key: commerce-service/payment-provider
        property: webhook-signing-secret
